<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 640" width="1600" height="640" role="img" aria-labelledby="streamTitle streamDesc">
  <title id="streamTitle">agent-loop brutalist streaming lifecycle schematic</title>
  <desc id="streamDesc">High-precision brutalist minimalist diagram of the tool call streaming lifecycle protocol.</desc>
  <defs>
    <!-- Technical Drafting Grid -->
    <pattern id="brutalistGridStream" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#161616" stroke-width="1"/>
      <path d="M 0 0 L 4 0 M 0 0 L 0 4 M 40 40 L 36 40 M 40 40 L 40 36" fill="none" stroke="#2a2a2a" stroke-width="1"/>
      <circle cx="40" cy="40" r="1" fill="#333333"/>
    </pattern>

    <!-- Markers -->
    <marker id="smWhite" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <polygon points="0,1 6,4 0,7" fill="#ffffff"/>
    </marker>
    <marker id="smGreen" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <polygon points="0,1 6,4 0,7" fill="#00ff66"/>
    </marker>
    <marker id="smOrange" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <polygon points="0,1 6,4 0,7" fill="#ff3e00"/>
    </marker>

    <style>
      .mono { font-family: "JetBrains Mono", "SF Mono", "Roboto Mono", Menlo, Consolas, monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif; }
      .st-hero { font-weight: 900; font-size: 24px; fill: #ffffff; letter-spacing: 2px; }
      .st-sub { font-weight: 600; font-size: 11px; fill: #777777; letter-spacing: 1.5px; }
      .st-card-head { font-weight: 800; font-size: 12px; letter-spacing: 1px; }
      .st-card-title { font-weight: 800; font-size: 18px; letter-spacing: -0.3px; }
      .st-card-sub { font-weight: 600; font-size: 12px; }
      .st-card-desc { font-weight: 500; font-size: 12.5px; fill: #888888; line-height: 1.4; }
      .st-code { font-weight: 700; font-size: 11px; fill: #dddddd; }
      .st-badge { font-weight: 800; font-size: 10px; letter-spacing: 1.2px; }
      .st-wire-w { stroke: #ffffff; stroke-width: 2; fill: none; marker-end: url(#smWhite); }
      .st-wire-g { stroke: #00ff66; stroke-width: 2; fill: none; marker-end: url(#smGreen); }
      .st-wire-o { stroke: #ff3e00; stroke-width: 2; fill: none; marker-end: url(#smOrange); }
    </style>
  </defs>

  <!-- Canvas Base -->
  <rect width="1600" height="640" fill="#090909"/>
  <rect width="1600" height="640" fill="url(#brutalistGridStream)"/>

  <!-- Outer Technical Drafting Frame -->
  <rect x="20" y="20" width="1560" height="600" fill="none" stroke="#222222" stroke-width="2"/>
  <rect x="24" y="24" width="1552" height="592" fill="none" stroke="#161616" stroke-width="1"/>

  <!-- Corner Crop Marks -->
  <g stroke="#ffffff" stroke-width="1.5" opacity="0.8">
    <path d="M 20 40 L 40 40 M 40 20 L 40 40"/>
    <path d="M 1580 40 L 1560 40 M 1560 20 L 1560 40"/>
    <path d="M 20 600 L 40 600 M 40 620 L 40 600"/>
    <path d="M 1580 600 L 1560 600 M 1560 620 L 1560 600"/>
  </g>

  <!-- Header -->
  <g transform="translate(50, 48)">
    <rect x="0" y="0" width="34" height="34" fill="#ffffff"/>
    <rect x="9" y="9" width="16" height="16" fill="#090909"/>
    <rect x="14" y="14" width="6" height="6" fill="#00ff66"/>

    <text x="48" y="24" class="sans st-hero">AGENT-LOOP</text>
    <text x="248" y="24" class="mono st-hero" fill="#00ff66" font-weight="400">//</text>
    <text x="280" y="24" class="mono" font-size="15" font-weight="700" fill="#aaaaaa" letter-spacing="1.5px">SPEC: STREAMING EVENT LIFECYCLE</text>
    <text x="50" y="42" class="mono st-sub">REAL-TIME EXECUTION TELEMETRY • NON-BLOCKING PROGRESSION • DETERMINISTIC TERMINATION</text>

    <!-- Telemetry Status Pills -->
    <g transform="translate(1090, 4)">
      <rect x="0" y="0" width="124" height="26" fill="#141414" stroke="#333333" stroke-width="1"/>
      <rect x="0" y="0" width="6" height="26" fill="#00ff66"/>
      <text x="14" y="17" class="mono st-badge" fill="#ffffff">DISPATCH: LIVE</text>

      <rect x="136" y="0" width="120" height="26" fill="#141414" stroke="#333333" stroke-width="1"/>
      <rect x="136" y="0" width="6" height="26" fill="#ff3e00"/>
      <text x="150" y="17" class="mono st-badge" fill="#ffffff">POLLING: ZERO</text>

      <rect x="268" y="0" width="130" height="26" fill="#ffffff"/>
      <text x="276" y="17" class="mono st-badge" fill="#000000">SPEC: PROTOCOL</text>
    </g>
  </g>

  <!-- Divider -->
  <line x1="50" y1="108" x2="1550" y2="108" stroke="#222222" stroke-width="1.5"/>

  <!-- ========================================================================= -->
  <!-- 3 EVENT STAGES COLUMNS                                                    -->
  <!-- ========================================================================= -->

  <!-- STAGE 01: ToolCallStartedEvent -->
  <g transform="translate(50, 134)">
    <rect width="470" height="340" fill="#111111" stroke="#ffffff" stroke-width="2"/>
    <rect x="0" y="0" width="470" height="32" fill="#ffffff"/>
    <text x="14" y="21" class="mono st-card-head" fill="#000000">EVENT // 01 • INITIATION</text>
    <text x="370" y="21" class="mono st-badge" fill="#000000">[PHASE: T_0]</text>

    <text x="20" y="66" class="mono st-card-title" fill="#ffffff">ToolCallStartedEvent</text>
    <text x="20" y="90" class="mono st-card-sub" fill="#00ff66">TRIGGER: DISPATCH READY</text>

    <line x1="20" y1="104" x2="450" y2="104" stroke="#222222" stroke-width="1"/>
    
    <text x="20" y="126" class="sans st-card-desc">Emitted the instant an approved tool call is accepted by</text>
    <text x="20" y="146" class="sans st-card-desc">the dispatcher and about to execute in isolation.</text>

    <!-- Code Block Spec -->
    <g transform="translate(20, 166)">
      <rect width="430" height="144" fill="#090909" stroke="#2a2a2a" stroke-width="1"/>
      <rect x="0" y="0" width="430" height="22" fill="#161616"/>
      <text x="12" y="15" class="mono st-badge" fill="#888888">PAYLOAD STRUCTURE :: ToolCallStartedEvent</text>

      <text x="12" y="44" class="mono st-code" fill="#aaaaaa">event_type: <tspan fill="#00ff66">"tool_call_started"</tspan></text>
      <text x="12" y="66" class="mono st-code" fill="#aaaaaa">tool_name:  <tspan fill="#ffffff">"shell" | "read" | "edit" | "mcp"</tspan></text>
      <text x="12" y="88" class="mono st-code" fill="#aaaaaa">call_id:    <tspan fill="#ff9900">"call_984x2"</tspan></text>
      <text x="12" y="110" class="mono st-code" fill="#aaaaaa">timestamp:  <tspan fill="#ffffff">1727878800.104</tspan></text>
      <text x="12" y="132" class="mono st-code" fill="#aaaaaa">args:       <tspan fill="#cccccc">{"command": "pytest -q"}</tspan></text>
    </g>
  </g>

  <!-- Arrow Stage 01 -> Stage 02 -->
  <path d="M 520 304 L 560 304" class="st-wire-g"/>

  <!-- STAGE 02: ToolCallDeltaEvent (ACID GREEN BRUTALIST FOCUS) -->
  <g transform="translate(560, 134)">
    <rect width="480" height="340" fill="#0b140e" stroke="#00ff66" stroke-width="2.5"/>
    <rect x="0" y="0" width="480" height="32" fill="#00ff66"/>
    <text x="14" y="21" class="mono st-card-head" fill="#000000">EVENT // 02 • STREAMING PROGRESSION</text>
    <text x="380" y="21" class="mono st-badge" fill="#000000">[PHASE: T_DELTA]</text>

    <text x="20" y="66" class="mono st-card-title" fill="#ffffff">ToolCallDeltaEvent</text>
    <text x="20" y="90" class="mono st-card-sub" fill="#00ff66">TRIGGER: REAL-TIME BUFFER FLUSH</text>

    <line x1="20" y1="104" x2="460" y2="104" stroke="#16331e" stroke-width="1"/>
    
    <text x="20" y="126" class="sans st-card-desc" fill="#b0d4bb">Yields live chunk deltas from running subprocesses,</text>
    <text x="20" y="146" class="sans st-card-desc" fill="#b0d4bb">terminal output streams, or model extended thinking.</text>

    <!-- Code Block Spec -->
    <g transform="translate(20, 166)">
      <rect width="440" height="144" fill="#080e0a" stroke="#00aa44" stroke-width="1"/>
      <rect x="0" y="0" width="440" height="22" fill="#122416"/>
      <text x="12" y="15" class="mono st-badge" fill="#00ff66">PAYLOAD STRUCTURE :: ToolCallDeltaEvent</text>

      <text x="12" y="44" class="mono st-code" fill="#88cc99">event_type: <tspan fill="#ffffff">"tool_call_delta"</tspan></text>
      <text x="12" y="66" class="mono st-code" fill="#88cc99">tool_name:  <tspan fill="#ffffff">"shell"</tspan></text>
      <text x="12" y="88" class="mono st-code" fill="#88cc99">chunk_type: <tspan fill="#00ff66">"stdout"</tspan> | <tspan fill="#ff3e00">"stderr"</tspan> | <tspan fill="#00e5ff">"thinking"</tspan></text>
      <text x="12" y="110" class="mono st-code" fill="#88cc99">data:       <tspan fill="#ffffff">"running test_agent.py ...\n"</tspan></text>
      <text x="12" y="132" class="mono st-code" fill="#88cc99">delta_seq:  <tspan fill="#ff9900">42</tspan> [monotonic counter]</text>
    </g>
  </g>

  <!-- Arrow Stage 02 -> Stage 03 -->
  <path d="M 1040 304 L 1080 304" class="st-wire-o"/>

  <!-- STAGE 03: ToolCallCompletedEvent -->
  <g transform="translate(1080, 134)">
    <rect width="470" height="340" fill="#111111" stroke="#ffffff" stroke-width="2"/>
    <rect x="0" y="0" width="470" height="32" fill="#ffffff"/>
    <text x="14" y="21" class="mono st-card-head" fill="#000000">EVENT // 03 • FINAL CONVERGENCE</text>
    <text x="370" y="21" class="mono st-badge" fill="#000000">[PHASE: T_END]</text>

    <text x="20" y="66" class="mono st-card-title" fill="#ffffff">ToolCallCompletedEvent</text>
    <text x="20" y="90" class="mono st-card-sub" fill="#ff3e00">TRIGGER: EXECUTION EXIT</text>

    <line x1="20" y1="104" x2="450" y2="104" stroke="#222222" stroke-width="1"/>
    
    <text x="20" y="126" class="sans st-card-desc">Emitted upon exit code resolution with complete aggregated</text>
    <text x="20" y="146" class="sans st-card-desc">payload, latency metrics, and turn state outcome.</text>

    <!-- Code Block Spec -->
    <g transform="translate(20, 166)">
      <rect width="430" height="144" fill="#090909" stroke="#2a2a2a" stroke-width="1"/>
      <rect x="0" y="0" width="430" height="22" fill="#161616"/>
      <text x="12" y="15" class="mono st-badge" fill="#888888">PAYLOAD STRUCTURE :: ToolCallCompletedEvent</text>

      <text x="12" y="44" class="mono st-code" fill="#aaaaaa">event_type:  <tspan fill="#ff3e00">"tool_call_completed"</tspan></text>
      <text x="12" y="66" class="mono st-code" fill="#aaaaaa">tool_name:   <tspan fill="#ffffff">"shell"</tspan></text>
      <text x="12" y="88" class="mono st-code" fill="#aaaaaa">exit_code:   <tspan fill="#00ff66">0</tspan> (success)</text>
      <text x="12" y="110" class="mono st-code" fill="#aaaaaa">duration_ms: <tspan fill="#ff9900">314.8</tspan></text>
      <text x="12" y="132" class="mono st-code" fill="#aaaaaa">result:      <tspan fill="#ffffff">"12 passed in 0.31s"</tspan></text>
    </g>
  </g>

  <!-- ========================================================================= -->
  <!-- BOTTOM ARCHITECTURE BUS: NON-BLOCKING PIPELINE                           -->
  <!-- ========================================================================= -->
  <g transform="translate(50, 498)">
    <rect width="1500" height="88" fill="#111111" stroke="#333333" stroke-width="1.5"/>
    <rect x="0" y="0" width="1500" height="24" fill="#1a1a1a"/>
    <text x="14" y="16" class="mono st-card-head" fill="#888888">CONSUMPTION INTERFACE // NON-BLOCKING PROTOCOL GUARANTEES</text>
    
    <g transform="translate(20, 40)">
      <text x="0" y="14" class="mono st-code" fill="#00ff66">CONSUMER PATTERN:</text>
      <text x="160" y="14" class="mono st-code" fill="#ffffff">for event in agent.run(task):</text>
      <text x="420" y="14" class="mono st-code" fill="#888888"># Synchronous generator yields async events in-thread</text>

      <text x="0" y="34" class="mono st-code" fill="#ff3e00">PROCESS BRIDGE:</text>
      <text x="160" y="34" class="mono st-code" fill="#ffffff">echo '{"task": "..."}' | python3 scripts/run-as-child.py</text>
      <text x="680" y="34" class="mono st-code" fill="#888888"># Streams newline-delimited JSON (NDJSON)</text>
    </g>

    <!-- Protocol stamp -->
    <g transform="translate(1360, 36)">
      <rect x="0" y="0" width="120" height="28" fill="#000000" stroke="#444444" stroke-width="1"/>
      <text x="12" y="18" class="mono st-badge" fill="#ffffff">NDJSON BUS OK</text>
    </g>
  </g>

  <!-- Footer Technical Annotation -->
  <g transform="translate(50, 608)">
    <text x="0" y="0" class="mono st-sub">AGENT-LOOP PROTOCOL // STREAMING TELEMETRY LIFECYCLE • FIG: 02-STREAM • ZERO-POLLING EVENT BUS</text>
    <text x="1490" y="0" text-anchor="end" class="mono st-sub">SPEC: REV-2.1</text>
  </g>
</svg>
