<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 680" width="1600" height="680" role="img" aria-labelledby="mcpTitle mcpDesc">
  <title id="mcpTitle">agent-loop brutalist mcp snapshot cache schematic</title>
  <desc id="mcpDesc">Technical architectural schematic showing the MCP snapshot cache and generational invalidation system of agent-loop.</desc>
  <defs>
    <pattern id="brutalistGridMcp" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#161616" stroke-width="1"/>
      <path d="M 0 0 L 4 0 M 0 0 L 0 4 M 40 40 L 36 40 M 40 40 L 40 36" fill="none" stroke="#2a2a2a" stroke-width="1"/>
      <circle cx="40" cy="40" r="1" fill="#333333"/>
    </pattern>

    <marker id="mcpWhite" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <polygon points="0,1 6,4 0,7" fill="#ffffff"/>
    </marker>
    <marker id="mcpGreen" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <polygon points="0,1 6,4 0,7" fill="#00ff66"/>
    </marker>
    <marker id="mcpOrange" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <polygon points="0,1 6,4 0,7" fill="#ff3e00"/>
    </marker>

    <style>
      .mono { font-family: "JetBrains Mono", "SF Mono", "Roboto Mono", Menlo, Consolas, monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif; }
      .mc-hero { font-weight: 900; font-size: 24px; fill: #ffffff; letter-spacing: 2px; }
      .mc-sub { font-weight: 600; font-size: 11px; fill: #777777; letter-spacing: 1.5px; }
      .mc-head { font-weight: 800; font-size: 12px; letter-spacing: 1px; }
      .mc-title { font-weight: 800; font-size: 17px; fill: #ffffff; letter-spacing: -0.3px; }
      .mc-desc { font-weight: 500; font-size: 12px; fill: #888888; line-height: 1.4; }
      .mc-code { font-weight: 700; font-size: 11px; fill: #dddddd; }
      .mc-badge { font-weight: 800; font-size: 10px; letter-spacing: 1.2px; }
      .m-wire-w { stroke: #ffffff; stroke-width: 2; fill: none; marker-end: url(#mcpWhite); }
      .m-wire-g { stroke: #00ff66; stroke-width: 2; fill: none; marker-end: url(#mcpGreen); }
      .m-wire-o { stroke: #ff3e00; stroke-width: 2; fill: none; marker-end: url(#mcpOrange); }
      .m-wire-dash { stroke: #444444; stroke-width: 1.5; stroke-dasharray: 4 4; fill: none; }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1600" height="680" fill="#090909"/>
  <rect width="1600" height="680" fill="url(#brutalistGridMcp)"/>

  <!-- Outer Frame -->
  <rect x="20" y="20" width="1560" height="640" fill="none" stroke="#222222" stroke-width="2"/>
  <rect x="24" y="24" width="1552" height="632" fill="none" stroke="#161616" stroke-width="1"/>

  <!-- Corner Crop Marks -->
  <g stroke="#ffffff" stroke-width="1.5" opacity="0.8">
    <path d="M 20 40 L 40 40 M 40 20 L 40 40"/>
    <path d="M 1580 40 L 1560 40 M 1560 20 L 1560 40"/>
    <path d="M 20 640 L 40 640 M 40 660 L 40 640"/>
    <path d="M 1580 640 L 1560 640 M 1560 660 L 1560 640"/>
  </g>

  <!-- Header -->
  <g transform="translate(50, 48)">
    <rect x="0" y="0" width="34" height="34" fill="#ffffff"/>
    <rect x="9" y="9" width="16" height="16" fill="#090909"/>
    <rect x="14" y="14" width="6" height="6" fill="#00e5ff"/>

    <text x="48" y="24" class="sans mc-hero">AGENT-LOOP</text>
    <text x="248" y="24" class="mono mc-hero" fill="#00e5ff" font-weight="400">//</text>
    <text x="280" y="24" class="mono" font-size="15" font-weight="700" fill="#aaaaaa" letter-spacing="1.5px">SPEC: MCP SNAPSHOT LEASE &amp; GENERATION CACHE</text>
    <text x="50" y="42" class="mono mc-sub">GENERATIONAL LEASE TRACKING • PROTOCOL CHECKSUM INVALIDATION • ZERO-LATENCY TURN DISPATCH</text>

    <!-- Header Badges -->
    <g transform="translate(1090, 4)">
      <rect x="0" y="0" width="130" height="26" fill="#141414" stroke="#333333" stroke-width="1"/>
      <rect x="0" y="0" width="6" height="26" fill="#00ff66"/>
      <text x="14" y="17" class="mono mc-badge" fill="#ffffff">CACHE: HIT-RATIO 99%</text>

      <rect x="142" y="0" width="120" height="26" fill="#141414" stroke="#333333" stroke-width="1"/>
      <rect x="142" y="0" width="6" height="26" fill="#00e5ff"/>
      <text x="156" y="17" class="mono mc-badge" fill="#ffffff">DIFFS: CHECKSUM</text>

      <rect x="274" y="0" width="124" height="26" fill="#ffffff"/>
      <text x="282" y="17" class="mono mc-badge" fill="#000000">SPEC: MCP-CACHE</text>
    </g>
  </g>

  <!-- Divider -->
  <line x1="50" y1="108" x2="1550" y2="108" stroke="#222222" stroke-width="1.5"/>

  <!-- ========================================================================= -->
  <!-- 4 HORIZONTAL ARCHITECTURE BLOCKS                                          -->
  <!-- ========================================================================= -->

  <!-- BLOCK 01: EXTERNAL MCP SERVERS -->
  <g transform="translate(50, 134)">
    <rect width="320" height="370" fill="#111111" stroke="#ffffff" stroke-width="2"/>
    <rect x="0" y="0" width="320" height="30" fill="#ffffff"/>
    <text x="12" y="20" class="mono mc-head" fill="#000000">01 // EXTERNAL MCP SERVERS</text>
    
    <text x="16" y="60" class="sans mc-title">Model Context Servers</text>
    <text x="16" y="82" class="mono mc-code" fill="#888888">TRANSPORT: Stdio / HTTP SSE</text>
    
    <line x1="16" y1="96" x2="304" y2="96" stroke="#222222" stroke-width="1"/>

    <!-- Server Items -->
    <g transform="translate(16, 110)">
      <rect width="288" height="52" fill="#161616" stroke="#333333" stroke-width="1"/>
      <text x="12" y="24" class="mono mc-badge" fill="#ffffff">SERVER 01: sqlite</text>
      <text x="12" y="42" class="mono mc-code" fill="#00ff66">tools: query, inspect_table</text>

      <rect y="64" width="288" height="52" fill="#161616" stroke="#333333" stroke-width="1"/>
      <text x="12" y="88" class="mono mc-badge" fill="#ffffff">SERVER 02: github</text>
      <text x="12" y="106" class="mono mc-code" fill="#00e5ff">tools: create_pr, list_issues</text>

      <rect y="128" width="288" height="52" fill="#161616" stroke="#333333" stroke-width="1"/>
      <text x="12" y="152" class="mono mc-badge" fill="#ffffff">SERVER 03: custom_tools</text>
      <text x="12" y="170" class="mono mc-code" fill="#ffaa00">tools: deploy, lint, format</text>
    </g>

    <text x="16" y="324" class="sans mc-desc">Remote MCP tools advertise complex</text>
    <text x="16" y="344" class="sans mc-desc">JSON schema tool definitions.</text>
  </g>

  <!-- Wire 01 -> 02 -->
  <path d="M 370 319 L 430 319" class="m-wire-w"/>

  <!-- BLOCK 02: GENERATIONAL LEASE PROVIDER -->
  <g transform="translate(430, 134)">
    <rect width="360" height="370" fill="#111111" stroke="#ffffff" stroke-width="1.5"/>
    <rect x="0" y="0" width="360" height="30" fill="#222222"/>
    <text x="12" y="20" class="mono mc-head" fill="#ffffff">02 // GENERATIONAL TRACKING</text>
    <text x="260" y="20" class="mono mc-badge" fill="#00e5ff">[DIFF LEASE]</text>

    <text x="16" y="60" class="sans mc-title">Snapshot Lease Engine</text>
    <text x="16" y="82" class="mono mc-code" fill="#00e5ff">CLASS: McpSnapshotLease</text>
    
    <line x1="16" y1="96" x2="344" y2="96" stroke="#222222" stroke-width="1"/>

    <!-- Schema Card -->
    <g transform="translate(16, 110)">
      <rect width="328" height="150" fill="#090909" stroke="#2a2a2a" stroke-width="1"/>
      <rect x="0" y="0" width="328" height="22" fill="#161616"/>
      <text x="10" y="15" class="mono mc-badge" fill="#888888">LEASE METRICS &amp; GENERATION</text>

      <text x="10" y="44" class="mono mc-code" fill="#aaaaaa">generation_id: <tspan fill="#ff3e00">1042</tspan> (incrementing)</text>
      <text x="10" y="66" class="mono mc-code" fill="#aaaaaa">checksum:      <tspan fill="#00ff66">"0x98f4a1c"</tspan> (SHA256)</text>
      <text x="10" y="88" class="mono mc-code" fill="#aaaaaa">ttl_status:    <tspan fill="#ffffff">LEASE_VALID</tspan></text>
      <text x="10" y="110" class="mono mc-code" fill="#aaaaaa">delta_check:   <tspan fill="#00e5ff">NO_DIFF (SKIPPED)</tspan></text>
      <text x="10" y="132" class="mono mc-code" fill="#aaaaaa">invalidation:  <tspan fill="#888888">ON_SERVER_RELOAD</tspan></text>
    </g>

    <text x="16" y="284" class="sans mc-desc">Assigns an incremental generation</text>
    <text x="16" y="304" class="sans mc-desc">ID to every registered tool bundle.</text>
    <text x="16" y="324" class="sans mc-desc">Only queries MCP on checksum shift.</text>

    <rect x="16" y="336" width="328" height="20" fill="#161616"/>
    <text x="24" y="350" class="mono mc-badge" fill="#00ff66">ROUND-TRIP AVOIDED: 100%</text>
  </g>

  <!-- Wire 02 -> 03 (Green) -->
  <path d="M 790 319 L 850 319" class="m-wire-g"/>

  <!-- BLOCK 03: MEMORY SNAPSHOT CACHE -->
  <g transform="translate(850, 134)">
    <rect width="360" height="370" fill="#0d140f" stroke="#00ff66" stroke-width="2.5"/>
    <rect x="0" y="0" width="360" height="30" fill="#00ff66"/>
    <text x="12" y="20" class="mono mc-head" fill="#000000">03 // IN-MEMORY SNAPSHOT CACHE</text>
    <text x="270" y="20" class="mono mc-badge" fill="#000000">[HOT CACHE]</text>

    <text x="16" y="60" class="sans mc-title" fill="#ffffff">McpSnapshotCache</text>
    <text x="16" y="82" class="mono mc-code" fill="#00dd55">REGISTER: Local Memory Table</text>
    
    <line x1="16" y1="96" x2="344" y2="96" stroke="#16331e" stroke-width="1"/>

    <!-- Cached Payload Spec -->
    <g transform="translate(16, 110)">
      <rect width="328" height="150" fill="#080e0a" stroke="#00aa44" stroke-width="1"/>
      <rect x="0" y="0" width="328" height="22" fill="#122416"/>
      <text x="10" y="15" class="mono mc-badge" fill="#00ff66">SNAPSHOT LOOKUP TABLE</text>

      <text x="10" y="44" class="mono mc-code" fill="#88cc99">"mcp__sqlite__query": {</text>
      <text x="20" y="66" class="mono mc-code" fill="#ffffff">  "cached": true,</text>
      <text x="20" y="88" class="mono mc-code" fill="#ffffff">  "inputSchema": {...},</text>
      <text x="20" y="110" class="mono mc-code" fill="#ffffff">  "target_url": "http://127.0.0.1"</text>
      <text x="10" y="132" class="mono mc-code" fill="#88cc99">}</text>
    </g>

    <text x="16" y="284" class="sans mc-desc" fill="#b0d4bb">Instant zero-latency lookup for tool</text>
    <text x="16" y="304" class="sans mc-desc" fill="#b0d4bb">definitions and JSON input schemas.</text>
    <text x="16" y="324" class="sans mc-desc" fill="#b0d4bb">Powers model tool specification list.</text>

    <rect x="16" y="336" width="328" height="20" fill="#122416"/>
    <text x="24" y="350" class="mono mc-badge" fill="#00ff66">RETRIEVAL LATENCY &lt; 0.05ms</text>
  </g>

  <!-- Wire 03 -> 04 -->
  <path d="M 1210 319 L 1270 319" class="m-wire-w"/>

  <!-- BLOCK 04: EXECUTION DISPATCHER & LLM PROMPT -->
  <g transform="translate(1270, 134)">
    <rect width="280" height="370" fill="#111111" stroke="#ffffff" stroke-width="2"/>
    <rect x="0" y="0" width="280" height="30" fill="#ffffff"/>
    <text x="12" y="20" class="mono mc-head" fill="#000000">04 // TURN INJECTION</text>
    
    <text x="16" y="60" class="sans mc-title">Turn Dispatcher</text>
    <text x="16" y="82" class="mono mc-code" fill="#888888">CONSUMER: LLMAgent</text>
    
    <line x1="16" y1="96" x2="264" y2="96" stroke="#222222" stroke-width="1"/>

    <!-- Target Cards -->
    <g transform="translate(16, 110)">
      <rect width="248" height="70" fill="#161616" stroke="#333333" stroke-width="1"/>
      <text x="10" y="20" class="mono mc-badge" fill="#ffffff">LLM CONTEXT BUILDER</text>
      <text x="10" y="40" class="sans mc-desc">Injects cached tool specs</text>
      <text x="10" y="58" class="sans mc-desc">into model system prompt.</text>

      <rect y="84" width="248" height="70" fill="#161616" stroke="#333333" stroke-width="1"/>
      <text x="10" y="104" class="mono mc-badge" fill="#ff3e00">CALLABLE MCP RUNNER</text>
      <text x="10" y="124" class="sans mc-desc">Dispatches approved call</text>
      <text x="10" y="142" class="sans mc-desc">to server HTTP bridge.</text>
    </g>

    <text x="16" y="284" class="sans mc-desc">Zero schema re-fetch per</text>
    <text x="16" y="304" class="sans mc-desc">conversation turn.</text>

    <rect x="16" y="336" width="248" height="20" fill="#181818"/>
    <text x="24" y="350" class="mono mc-badge" fill="#ffffff">STATUS: OPTIMAL</text>
  </g>

  <!-- ========================================================================= -->
  <!-- BOTTOM CODE SPECIFICATION PANEL                                           -->
  <!-- ========================================================================= -->
  <g transform="translate(50, 524)">
    <rect width="1500" height="90" fill="#111111" stroke="#333333" stroke-width="1.5"/>
    <rect x="0" y="0" width="1500" height="24" fill="#1a1a1a"/>
    <text x="14" y="16" class="mono mc-head" fill="#888888">PYTHON USAGE // GENERATION CACHE ASSERTION</text>
    
    <g transform="translate(20, 38)">
      <text x="0" y="14" class="mono mc-code" fill="#00e5ff">REGISTER SERVER:</text>
      <text x="180" y="14" class="mono mc-code" fill="#ffffff">cache = McpSnapshotCache(); cache.register_server("sqlite")</text>
      <text x="730" y="14" class="mono mc-code" fill="#888888"># Tracks known server identifiers</text>

      <text x="0" y="34" class="mono mc-code" fill="#00ff66">SNAPSHOT ASSERT:</text>
      <text x="180" y="34" class="mono mc-code" fill="#ffffff">snapshot = cache.get_snapshot(); assert snapshot.checksum == cache.get_checksum("sqlite")</text>
      <text x="960" y="34" class="mono mc-code" fill="#888888"># Verified generation hash</text>
    </g>

    <g transform="translate(1350, 36)">
      <rect x="0" y="0" width="130" height="28" fill="#000000" stroke="#444444" stroke-width="1"/>
      <text x="12" y="18" class="mono mc-badge" fill="#ffffff">GENERATION: 0x01</text>
    </g>
  </g>

  <!-- Footer -->
  <g transform="translate(50, 646)">
    <text x="0" y="0" class="mono mc-sub">AGENT-LOOP PROTOCOL // MCP SNAPSHOT LEASE &amp; CACHE SPECIFICATION • FIG: 05-MCP-CACHE</text>
    <text x="1490" y="0" text-anchor="end" class="mono mc-sub">SPEC: REV-1.1</text>
  </g>
</svg>
